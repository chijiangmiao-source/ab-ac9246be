# Flight-controller redundant-controller lock-voting audit service.
services:
  audit:
    build:
      context: .
      target: runtime
    image: pollux-lock-audit:latest
    container_name: pollux-lock-audit
    environment:
      # The exposed port is configurable; defaults to 8080.
      PORT: "${AUDIT_PORT:-8080}"
      HOST: "0.0.0.0"
    ports:
      - "${AUDIT_PORT:-8080}:${AUDIT_PORT:-8080}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # One-shot verification job. Builds the image(s), waits for the service to be
  # healthy, replays lock-rule tests, then runs commit/reject API and HTTP
  # smoke against the running audit container. Exits 0 on success, 1 otherwise.
  #
  #   docker compose build audit verify
  #   docker compose run --rm verify
  verify:
    build:
      context: .
      target: verify
    image: pollux-lock-audit:verify
    profiles: ["verify"]
    depends_on:
      audit:
        condition: service_healthy
    environment:
      AUDIT_BASE_URL: "http://audit:8080"
    restart: "no"
